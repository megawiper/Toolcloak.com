<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1204 366" width="1204" height="366" role="img" aria-label="Why Toolcloak is different"><defs><clipPath id="r"><rect width="1204" height="366" rx="26"/></clipPath><linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><g clip-path="url(#r)"><rect width="1204" height="366" fill="url(#bgh)"/><g transform="translate(22,22)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.00s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0 24;0 0" dur=".7s" begin="0.00s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
<rect width="372" height="150" rx="22" fill="#7c3aed" fill-opacity=".13"/>
<rect width="372" height="150" rx="22" fill="none" stroke="#7c3aed" stroke-opacity=".75" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;.95;.35" dur="4s" begin="0.70s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="46" r="26" fill="#7c3aed" fill-opacity=".28"/><text x="46" y="56" text-anchor="middle" font-size="26">🔒</text>
<text x="86" y="52" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Private by construction</text>
<text x="86" y="84" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Static site, no backend of ours,</text><text x="86" y="102" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">libraries bundled instead of loaded from</text><text x="86" y="120" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">CDNs.</text></g><g transform="translate(416,22)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.15s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0 24;0 0" dur=".7s" begin="0.15s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
<rect width="372" height="150" rx="22" fill="#22c55e" fill-opacity=".13"/>
<rect width="372" height="150" rx="22" fill="none" stroke="#22c55e" stroke-opacity=".75" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;.95;.35" dur="4s" begin="0.85s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="46" r="26" fill="#22c55e" fill-opacity=".28"/><text x="46" y="56" text-anchor="middle" font-size="26">🧾</text>
<text x="86" y="52" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Proof, not a slogan</text>
<text x="86" y="84" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">A live pill adds up every file-like</text><text x="86" y="102" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">upload. It says 0 bytes uploaded.</text></g><g transform="translate(810,22)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.30s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0 24;0 0" dur=".7s" begin="0.30s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
<rect width="372" height="150" rx="22" fill="#3b82f6" fill-opacity=".13"/>
<rect width="372" height="150" rx="22" fill="none" stroke="#3b82f6" stroke-opacity=".75" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;.95;.35" dur="4s" begin="1.00s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="46" r="26" fill="#3b82f6" fill-opacity=".28"/><text x="46" y="56" text-anchor="middle" font-size="26">🧠</text>
<text x="86" y="52" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">An assistant with no AI server</text>
<text x="86" y="84" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Fedra plans jobs with a rule engine and</text><text x="86" y="102" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">a safe calculator. Nothing leaves the</text><text x="86" y="120" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">page.</text></g><g transform="translate(22,194)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.45s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0 24;0 0" dur=".7s" begin="0.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
<rect width="372" height="150" rx="22" fill="#f59e0b" fill-opacity=".13"/>
<rect width="372" height="150" rx="22" fill="none" stroke="#f59e0b" stroke-opacity=".75" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;.95;.35" dur="4s" begin="1.15s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="46" r="26" fill="#f59e0b" fill-opacity=".28"/><text x="46" y="56" text-anchor="middle" font-size="26">🔗</text>
<text x="86" y="52" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Tools that talk to each other</text>
<text x="86" y="84" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Chain tools, pause, edit a step, retry.</text><text x="86" y="102" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Send any result onward.</text></g><g transform="translate(416,194)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.60s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0 24;0 0" dur=".7s" begin="0.60s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
<rect width="372" height="150" rx="22" fill="#ec4899" fill-opacity=".13"/>
<rect width="372" height="150" rx="22" fill="none" stroke="#ec4899" stroke-opacity=".75" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;.95;.35" dur="4s" begin="1.30s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="46" r="26" fill="#ec4899" fill-opacity=".28"/><text x="46" y="56" text-anchor="middle" font-size="26">🏗️</text>
<text x="86" y="52" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Real workspaces</text>
<text x="86" y="84" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">PDF, Docs, Sheets, Data, Design, Graph,</text><text x="86" y="102" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">3D and a scanner. Saved to My Space.</text></g><g transform="translate(810,194)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.75s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0 24;0 0" dur=".7s" begin="0.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
<rect width="372" height="150" rx="22" fill="#06b6d4" fill-opacity=".13"/>
<rect width="372" height="150" rx="22" fill="none" stroke="#06b6d4" stroke-opacity=".75" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;.95;.35" dur="4s" begin="1.45s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="46" r="26" fill="#06b6d4" fill-opacity=".28"/><text x="46" y="56" text-anchor="middle" font-size="26">📴</text>
<text x="86" y="52" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Works offline</text>
<text x="86" y="84" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Install it as an app. Pages you opened</text><text x="86" y="102" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">keep working without a connection.</text></g></g></svg>